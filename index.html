<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yummy Food - Đặt Món Trực Tuyến</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f8f9fa; color: #333; padding-bottom: 60px; }
        header { background: linear-gradient(135deg, #ff4e50, #f9d423); color: white; text-align: center; padding: 2rem; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .search-container { margin-top: 1rem; }
        #search-box { width: 80%; max-width: 500px; padding: 10px 15px; border: none; border-radius: 25px; outline: none; font-size: 16px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        
        .container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 2rem; }
        .card { background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: transform 0.3s; display: flex; flex-direction: column; }
        .card:hover { transform: translateY(-5px); }
        .card img { width: 100%; height: 200px; object-fit: cover; background-color: #ddd; }
        .card-content { padding: 1.5rem; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .card-title { font-size: 1.2rem; margin-bottom: 0.5rem; color: #222; }
        .card-price { color: #ff4e50; font-weight: bold; font-size: 1.1rem; margin-bottom: 1rem; }
        .btn-add { background: #ff4e50; color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; transition: background 0.2s; }
        .btn-add:hover { background: #e03e40; }

        /* Phân trang */
        .pagination { display: flex; justify-content: center; gap: 10px; margin: 3rem 0; }
        .page-btn { padding: 10px 15px; border: 1px solid #ff4e50; background: white; color: #ff4e50; cursor: pointer; border-radius: 5px; font-weight: bold; }
        .page-btn.active, .page-btn:hover { background: #ff4e50; color: white; }

        /* Giỏ hàng Floating */
        .cart-float { position: fixed; bottom: 20px; right: 20px; background: #ff4e50; color: white; padding: 15px 25px; border-radius: 30px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 99; }

        /* Modal Đặt Hàng */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; padding: 1rem; }
        .modal-content { background: white; padding: 2rem; border-radius: 15px; max-width: 500px; width: 100%; max-height: 90vh; overflow-y: auto; position: relative; }
        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 24px; cursor: pointer; color: #666; }
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
        .qr-section { text-align: center; background: #f0f0f0; padding: 1rem; border-radius: 10px; margin-bottom: 1.2rem; }
        .qr-section img { max-width: 200px; margin-top: 10px; border: 3px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .btn-submit { background: #28a745; color: white; width: 100%; padding: 12px; border: none; border-radius: 5px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .btn-submit:hover { background: #218838; }
        
        #cart-summary { background: #fff3cd; padding: 10px; border-radius: 5px; margin-bottom: 1rem; font-size: 14px; }
    </style>
</head>
<body>

    <header>
        <h1>🍔 Yummy Food Court</h1>
        <p>Hương vị thơm ngon giao tận cửa nhà</p>
        <div class="search-container">
            <input type="text" id="search-box" placeholder="Tìm món ăn bạn thích tại đây..." oninput="handleSearch()">
        </div>
    </header>

    <div class="container">
        <div class="grid" id="food-grid"></div>
        <div class="pagination" id="pagination"></div>
    </div>

    <div class="cart-float" id="cart-float" onclick="openModal()">🛒 Giỏ hàng (<span id="cart-count">0</span>)</div>

    <div class="modal" id="order-modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 style="margin-bottom: 1rem; color: #ff4e50;">Thông tin đặt hàng</h2>
            
            <div id="cart-summary"></div>

            <div class="qr-section">
                <p><strong>Thanh toán quét mã QR tại đây:</strong></p>
                <img src="https://i.postimg.cc/sDsKFKMz/z7909838375007-7e5e88c2912f4deff037e0de239ad11c.jpg" alt="Mã QR thanh toán của cửa hàng">
                <p style="font-size: 12px; color: #666; margin-top: 5px;">Vui lòng chuyển khoản đúng số tiền đơn hàng</p>
            </div>

            <form id="google-order-form" onsubmit="submitToGoogleForm(event)">
                <div class="form-group">
                    <label>Họ và tên *</label>
                    <input type="text" id="cus-name" required placeholder="Nguyễn Văn A">
                </div>
                <div class="form-group">
                    <label>Số điện thoại *</label>
                    <input type="tel" id="cus-phone" required placeholder="0901234567">
                </div>
                <div class="form-group">
                    <label>Địa chỉ nhận hàng *</label>
                    <textarea id="cus-address" rows="2" required placeholder="Số nhà, Tên đường, Quận/Huyện..."></textarea>
                </div>
                <button type="submit" class="btn-submit">Xác Nhận Đặt Hàng & Gửi Đơn</button>
            </form>
        </div>
    </div>

    <script>
        // --- 1. CẤU HÌNH ĐƯỜNG DẪN GOOGLE FORM CỦA BẠN TẠI ĐÂY ---
        const CONFIG = {
            formId: "1FAIpQLSeUirj34F7WvGelcQwwaIvZ0i8bMFkIU4csl9Wyr3JkfNK68g", // Thay ID Form thật của bạn
            entryName: "entry.2005620554",      // Thay số ID ô Họ Tên
            entryPhone: "entry.1045781291",     // Thay số ID ô Số Điện Thoại
            entryAddress: "entry.1065046570",   // Thay số ID ô Địa Chỉ
            entryOrder: "entry.1166974658"      // Thay số ID ô Chi Tiết Đơn Hàng
        };

        // --- 2. DỮ LIỆU ĐỦ 24 MÓN ĂN VỚI ẢNH MINH HỌA ---
        const foods = [
            { id: 1, name: "Cơm Tấm Sườn Bì Chả", price: 45000, img: "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=400" },
            { id: 2, name: "Phở Bò Đặc Biệt", price: 55000, img: "https://images.unsplash.com/photo-1582576163215-ac999d300cac?w=400" },
            { id: 3, name: "Bún Chả Hà Nội", price: 50000, img: "https://images.unsplash.com/photo-1625398407796-82650a8c135f?w=400" },
            { id: 4, name: "Bánh Mì Thịt Nướng", price: 25000, img: "https://images.unsplash.com/photo-1600454021970-351eff4a6554?w=400" },
            { id: 5, name: "Gà Rán Giòn Cay", price: 35000, img: "https://images.unsplash.com/photo-1569058242253-92a9c755a0ec?w=400" },
            { id: 6, name: "Pizza Hải Sản Size L", price: 159000, img: "https://images.unsplash.com/photo-1513104890138-7c749659a591?w=400" },
            { id: 7, name: "Mì Ý Sốt Bò Bằm", price: 65000, img: "https://images.unsplash.com/photo-1516685018646-549198525c1b?w=400" },
            { id: 8, name: "Lẩu Thái Hải Sản Mini", price: 199000, img: "https://images.unsplash.com/photo-1547592180-85f173990554?w=400" },
            { id: 9, name: "Bún Bò Huế Gia Truyền", price: 50000, img: "https://images.unsplash.com/photo-1593560708920-61dd98c46a4e?w=400" },
            { id: 10, name: "Sushi Thập Cẩm 10 Viên", price: 120000, img: "https://images.unsplash.com/photo-1579871494447-9811cf80d66c?w=400" },
            { id: 11, name: "Kimbap Hàn Quốc Quyển", price: 35000, img: "https://images.unsplash.com/photo-1534422298391-e4f8c172dddb?w=400" },
            { id: 12, name: "Bánh Xèo Nam Bộ", price: 30000, img: "https://images.unsplash.com/photo-1626132647523-66f5bf380027?w=400" },
            { id: 13, name: "Mì Trộn Muối Ớt", price: 40000, img: "https://images.unsplash.com/photo-1612927601601-6638404737ce?w=400" },
            { id: 14, name: "Hủ Tiếu Nam Vang", price: 45000, img: "https://images.unsplash.com/photo-1569718212165-3a8278d5f624?w=400" },
            { id: 15, name: "Gỏi Cuốn Tôm Thịt (4 cái)", price: 40000, img: "https://images.unsplash.com/photo-1534422298391-e4f8c172dddb?w=400" },
            { id: 16, name: "Nem Nướng Nha Trang", price: 60000, img: "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=400" },
            { id: 17, name: "Trà Sữa Trân Châu Đường Đen", price: 35000, img: "https://images.unsplash.com/photo-1541658016709-82535e94bc69?w=400" },
            { id: 18, name: "Chè Thái Sầu Riêng", price: 30000, img: "https://images.unsplash.com/photo-1563729784474-d77dbb933a9e?w=400" },
            { id: 19, name: "Cơm Gà Xối Mỡ", price: 45000, img: "https://images.unsplash.com/photo-1565557623262-b51c2513a641?w=400" },
            { id: 20, name: "Bánh Cuốn Nóng Mộc Nhĩ", price: 30000, img: "https://images.unsplash.com/photo-1541832676-9b763b0239ab?w=400" },
            { id: 21, name: "Súp Cua Tóc Tiên", price: 25000, img: "https://images.unsplash.com/photo-1547592180-85f173990554?w=400" },
            { id: 22, name: "Xôi Xéo Ruốc Hành Phi", price: 20000, img: "https://images.unsplash.com/photo-1608897013039-887f21d8c804?w=400" },
            { id: 23, name: "Chân Gà Sả Tắc", price: 65000, img: "https://images.unsplash.com/photo-1562967914-608f82629710?w=400" },
            { id: 24, name: "Khoai Tây Chiên Lắc Phô Mai", price: 30000, img: "https://images.unsplash.com/photo-1573080496219-bb080dd4f877?w=400" }
        ];

        // Biến toàn cục quản lý trạng thái
        let filteredFoods = [...foods];
        let currentPage = 1;
        const itemsPerPage = 6;
        let cart = {};

        // --- 3. LOGIC HIỂN THỊ CHỨC NĂNG ---

        // Hiển thị danh sách món ăn lên màn hình
        function renderFoods() {
            const grid = document.getElementById("food-grid");
            grid.innerHTML = "";

            // Tính toán phân trang
            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageItems = filteredFoods.slice(start, end);

            if(pageItems.length === 0) {
                grid.innerHTML = "<p style='grid-column: 1/-1; text-align:center; padding: 2rem; color:#888;'>Không tìm thấy món ăn phù hợp!</p>";
                return;
            }

            pageItems.forEach(item => {
                const card = document.createElement("div");
                card.className = "card";
                card.innerHTML = `
                    <img src="${item.img}" alt="${item.name}">
                    <div class="card-content">
                        <div>
                            <h3 class="card-title">${item.name}</h3>
                            <p class="card-price">${item.price.toLocaleString('vi-VN')} đ</p>
                        </div>
                        <button class="btn-add" onclick="addToCart(${item.id})">Thêm vào giỏ</button>
                    </div>
                `;
                grid.appendChild(card);
            });

            renderPagination();
        }

        // Tạo nút bấm phân trang
        function renderPagination() {
            const pagination = document.getElementById("pagination");
            pagination.innerHTML = "";
            const totalPages = Math.ceil(filteredFoods.length / itemsPerPage);

            if (totalPages <= 1) return;

            for(let i = 1; i <= totalPages; i++) {
                const btn = document.createElement("button");
                btn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
                btn.innerText = i;
                btn.onclick = () => {
                    currentPage = i;
                    renderFoods();
                    window.scrollTo({top: 0, behavior: 'smooth'});
                };
                pagination.appendChild(btn);
            }
        }

        // Tự động tìm kiếm thời gian thực (Real-time Search)
        function handleSearch() {
            const keyword = document.getElementById("search-box").value.toLowerCase().trim();
            filteredFoods = foods.filter(food => food.name.toLowerCase().includes(keyword));
            currentPage = 1; // Khởi động lại về trang 1 khi lọc dữ liệu mới
            renderFoods();
        }

        // --- 4. LOGIC GIỎ HÀNG & ĐẶT HÀNG ---

        function addToCart(id) {
            cart[id] = (cart[id] || 0) + 1;
            updateCartFloat();
            alert("Đã thêm món vào giỏ hàng thành công!");
        }

        function updateCartFloat() {
            const totalItems = Object.values(cart).reduce((sum, val) => sum + val, 0);
            document.getElementById("cart-count").innerText = totalItems;
        }

        function getCartSummaryText() {
            let text = "";
            let total = 0;
            Object.keys(cart).forEach(id => {
                const food = foods.find(f => f.id == id);
                if (food && cart[id] > 0) {
                    const itemTotal = food.price * cart[id];
                    text += `- ${food.name} (SL: ${cart[id]}) = ${itemTotal.toLocaleString('vi-VN')} đ\n`;
                    total += itemTotal;
                }
            });
            return {
                details: text,
                totalStr: `Tổng cộng tiền thanh toán: ${total.toLocaleString('vi-VN')} VNĐ`
            };
        }

        function openModal() {
            const summary = getCartSummaryText();
            if(!summary.details) {
                alert("Giỏ hàng đang trống! Vui lòng chọn món trước.");
                return;
            }
            document.getElementById("cart-summary").innerHTML = `<strong>Đơn hàng của bạn:</strong><br>${summary.details.replace(/\n/g, '<br>')}<strong>${summary.totalStr}</strong>`;
            document.getElementById("order-modal").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("order-modal").style.display = "none";
        }

        // Hàm bí thuật: Gửi ngầm dữ liệu lên Google Form để chuyển tiếp dữ liệu sang Google Sheet
        function submitToGoogleForm(e) {
            e.preventDefault();
            
            const name = document.getElementById("cus-name").value;
            const phone = document.getElementById("cus-phone").value;
            const address = document.getElementById("cus-address").value;
            const summary = getCartSummaryText();
            const fullOrderDetails = summary.details + "\n" + summary.totalStr;

            // Tạo link API để submit ngầm sang Google Form
            const formUrl = `https://docs.google.com/forms/d/e/${CONFIG.formId}/formResponse`;
            
            const formData = new FormData();
            formData.append(CONFIG.entryName, name);
            formData.append(CONFIG.entryPhone, phone);
            formData.append(CONFIG.entryAddress, address);
            formData.append(CONFIG.entryOrder, fullOrderDetails);

            // Gửi bất đồng bộ ngầm ra ngoài
            fetch(formUrl, {
                method: "POST",
                mode: "no-cors",
                body: formData
            }).then(() => {
                alert("🎉 Đặt hàng thành công! Đơn hàng đã được lưu, hệ thống đang gửi thông báo qua Email của chủ shop.");
                cart = {}; // Xóa sạch giỏ hàng khi mua xong
                updateCartFloat();
                closeModal();
                document.getElementById("google-order-form").reset();
            }).catch(error => {
                alert("Có lỗi xảy ra, vui lòng liên hệ lại cửa hàng!");
                console.error(error);
            });
        }

        // Khởi chạy ứng dụng lúc đầu
        renderFoods();
    </script>
</body>
</html>
